<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="atlas">
<title>atlas — every corner mapped</title>
<!-- coverage orbit -->
<ellipse cx="120" cy="122" rx="96" ry="72" fill="none" stroke="#475569" stroke-width="7" stroke-dasharray="12 12"/>
<!-- survey dot riding the orbit -->
<circle r="8" fill="#2DD4BF">
<animateMotion dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.65 0 0.35 1" path="M216 122 A96 72 0 1 1 215.9 121.9"/>
</circle>
<!-- map pin -->
<path d="M120 46 C88 46 68 70 68 100 C68 142 120 194 120 194 C120 194 172 142 172 100 C172 70 152 46 120 46 Z" fill="#1E293B" stroke="#64748B" stroke-width="6"/>
<circle cx="120" cy="100" r="14" fill="#2DD4BF"/>
</svg>
